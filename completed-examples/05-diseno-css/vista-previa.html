<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centrado, bordes y espacios</title>
<style>
* { box-sizing: border-box; }
body {
  background-color: #e8f4ff;
  font-family: Arial, sans-serif;
  color: #333333;
}
.tarjeta {
  background-color: white;
  max-width: 600px;
  margin: 30px auto;
  padding: 24px;
  border: 2px solid #2563eb;
  border-radius: 12px;
  text-align: center;
}
h1 { color: #2563eb; font-size: 32px; }
ul { display: inline-block; text-align: left; }
img { max-width: 100%; height: auto; border-radius: 8px; }
a { color: #1d4ed8; }

</style>
</head>
<body>
<main class="tarjeta">
  <h1>Mi primera página web</h1>
  <h2>Sobre mí</h2>
  <p>Hola, soy Alex y me gusta la tecnología.</p>
  <p>Mi pasatiempo favorito es dibujar.</p>

  <h2>Mis pasatiempos</h2>
  <ul>
    <li>Jugar videojuegos</li>
    <li>Escuchar música</li>
    <li>Leer historias</li>
  </ul>

  <h2>Mi imagen favorita</h2>
  <img src="https://placehold.co/300x180/png?text=Mi+imagen" alt="Imagen de ejemplo con el texto Mi imagen" width="300" height="180">

  <p><a href="https://www.wikipedia.org/">Visitar Wikipedia</a></p>
</main>
</body>
</html>
