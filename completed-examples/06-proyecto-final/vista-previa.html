<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyecto final y errores comunes</title>
<style>
* { box-sizing: border-box; }
body {
  background-color: #e8f4ff;
  font-family: Arial, sans-serif;
  color: #333333;
}
.tarjeta {
  background-color: white;
  max-width: 600px;
  margin: 30px auto;
  padding: 24px;
  border: 2px solid #2563eb;
  border-radius: 12px;
  text-align: center;
}
h1 { color: #2563eb; font-size: 32px; }
ul { display: inline-block; text-align: left; }
img { max-width: 100%; height: auto; border-radius: 8px; }
a { color: #1d4ed8; }

.intro {
  font-size:18px;
}

h2{
  color:#2563eb;
}
.boton {
  display:inline-block;
  padding: 12px 20px;
  background-color:#2563eb;
  color:white;
  text-decoration: none;
  border-radius:8px;
}
footer{
  margin-top:20px;
  color:#555555;
  font-size:14px;
}
</style>
</head>
<body>
<main class="tarjeta">
  <h1>¡Hola, Soy Alex!</h1>
  <p class="intro">Bienvenido a mi primera página web</p>
  
  <h2>Sobre mí</h2>
  
  <p>Mi pasatiempo favorito es dibujar.</p>

  <h2>Otros pasatiempos</h2>
  <ul>
    <li>Jugar videojuegos</li>
    <li>Escuchar música</li>
    <li>Leer historias</li>
  </ul>

  <h2>Mi imagen favorita</h2>
  <img src="https://placehold.co/300x180/png?text=Mi+imagen" alt="Imagen de ejemplo con el texto Mi imagen" width="300" height="180">

  <p><a class="boton" href="https://www.wikipedia.org/">Visitar Wikipedia</a></p>
  <footer> Hecho con HTML Y CSS </footer>
  
</main>
</body>
</html>
